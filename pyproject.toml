[project]
name = "maps-mcp"
version = "0.1.0"
description = "MCP server for Google Maps Platform: geocoding, places, traffic-aware travel times"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nick Engel", email = "nick@engel.au" }]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "google-maps", "geocoding", "places", "routes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    # <2 pin: mcp 2.0 moved FastMCP out of mcp.server.fastmcp, so an
    # unpinned build crash-loops on import.
    "mcp[cli]>=1.0.0,<2",
    "httpx>=0.27.0",
    "uvicorn>=0.32.0",
]

[project.urls]
Homepage = "https://github.com/snickery/maps-mcp"
Issues = "https://github.com/snickery/maps-mcp/issues"

[project.scripts]
maps-mcp = "maps_mcp.server:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maps_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
